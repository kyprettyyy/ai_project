name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  python-services:
    name: Python ${{ matrix.service }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [gateway, evaluation]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: services/${{ matrix.service }}/requirements.txt
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r services/${{ matrix.service }}/requirements.txt
      - run: python -m compileall -q services/${{ matrix.service }}/app
      - run: python -m unittest discover -s services/${{ matrix.service }}/tests -v
      - run: python -m unittest discover -s tests/${{ matrix.service }} -v
      - if: matrix.service == 'gateway'
        run: python -m unittest discover -s tests/integration -v

  python-sdk-and-experiments:
    name: Python SDK and experiment harness
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: sdk/python/pyproject.toml
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e sdk/python
      - run: python -m unittest discover -s sdk/python/tests -v
      - run: python experiments/run_experiments.py

  frontend:
    name: Frontend ${{ matrix.app }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [gateway, evaluation]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/${{ matrix.app }}/package-lock.json
      - run: npm ci
        working-directory: web/${{ matrix.app }}
      - run: npm run build
        working-directory: web/${{ matrix.app }}
      # build:strict remains a documented release gate while the migrated API
      # response types are reconciled with the current FastAPI OpenAPI schema.
